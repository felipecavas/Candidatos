<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Digital 2026 - Propostas</title>
    <style>
        :root { --bg-color: #F9F9F9; --text-color: #333333; --brand-color: #1976D2; }
        body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; line-height: 1.6; overflow-y: auto; padding-bottom: 60px; }
        #app { max-width: 600px; margin: 0 auto; position: relative; }
        
        .candidate-card { background: #FFFFFF; border: 2px solid #E0E0E0; border-radius: 8px; padding: 16px; margin-bottom: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .candidate-card:hover { border-color: #999999; }
        .candidate-profile { display: flex; align-items: center; gap: 16px; }
        .candidate-photo { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; border: 2px solid #EEEEEE; }
        .candidate-name { font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; }
        .candidate-total { font-size: 1.1rem; color: #666; background: #EEE; padding: 6px 12px; border-radius: 20px; white-space: nowrap; }
        
        .card-convergencia { background: #FFFFFF; border-color: #B0BEC5; padding: 20px 16px; justify-content: center; }
        .card-convergencia .candidate-name { color: #455A64; font-size: 1.2rem; }
        .separator { border: none; border-top: 2px dashed #CCC; margin: 24px 0; }

        #detalhe-candidato, #detalhe-convergencia { display: none; background: #FFFFFF; padding: 20px; border-radius: 8px; border: 2px solid #E0E0E0; }
        .btn-voltar { background: none; border: none; color: var(--brand-color); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0 0 10px 0; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .detalhe-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 2px solid #EEE; padding-bottom: 16px; }
        .detalhe-header-info { display: flex; align-items: center; gap: 16px; font-size: 1.5rem; font-weight: bold; }
        
        .compare-select-container { text-align: right; margin-bottom: 20px; }
        .compare-select-container select { padding: 6px 12px; font-size: 0.9rem; border-radius: 4px; border: 1px solid #D0D0D0; background-color: transparent; color: #666; cursor: pointer; outline: none; width: 100%; max-width: 250px;}
        
        .bar-container { margin-bottom: 20px; cursor: pointer; }
        .bar-label { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; text-align: center;}
        .compare-row { display: flex; gap: 10px; align-items: flex-end; }
        .track-col { flex: 1; display: flex; flex-direction: column; }
        .track-name { font-size: 0.9rem; margin-bottom: 4px; color: #555; font-weight: bold; display: flex; align-items: center;}
        .bar-track { background-color: #E0E0E0; border-radius: 8px; height: 28px; width: 100%; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 8px; display: flex; align-items: center; padding-left: 10px; color: white; font-weight: bold; font-size: 0.9rem; transition: width 0.5s ease; }
        
        .propostas-lista { display: none; background-color: #F5F5F5; padding: 16px; border-radius: 8px; margin-top: 8px; }
        .propostas-lista h4 { margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; color: #333; display: flex; align-items: center; }
        .propostas-lista ul { margin: 0; padding: 0; list-style: none; }
        
        .prop-item-container { margin-bottom: 12px; border-bottom: 1px solid #E0E0E0; padding-bottom: 8px; }
        .prop-item-container:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .prop-resumo { font-size: 1.1rem; color: #333; cursor: pointer; display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; user-select: none; }
        .prop-resumo:hover { color: var(--brand-color); }
        
        .seta-expansao { font-size: 0.8rem; color: var(--brand-color); transition: transform 0.2s ease; margin-top: 4px; display: inline-block; }
        .seta-expansao.aberta { transform: rotate(90deg); }

        .asterisk:hover { color: #0D47A1; }

        .modal-text { font-size: 1.1rem; color: #333; margin-top: 8px; line-height: 1.5; }
    </style>
</head>

    <div id="detalhe-candidato">

        </div>
        <div id="grafico-barras"></div>
    </div>
</div>

        { tema: "IA Aplicada à Saúde e Prontuário Eletrônico Unificado", prop: [ { c: "Lula", t: "Telemedicina no SUS e criação do Supercentro Brasil de Telediagnóstico." }, { c: "Ronaldo Caiado", t: "Identidade clínica digital e modernização de Unidades Básicas de Saúde (UBS)." }, { c: "Romeu Zema", t: "Prontuário eletrônico e integração dos sistemas de saúde público e privado." }, { c: "Flávio Bolsonaro", t: "Prontuário eletrônico único e digitalização dos processos do SUS." }, { c: "Renan Santos", t: "Plataforma PRONTO (prontuário eletrônico nacional interoperável) e vigilância epidemiológica preditiva." }, { c: "Augusto Cury", t: "Tele Saúde Brasil (triagem por IA em 30 min) e Prontuário Eletrônico Único do SUS." } ] },
        { tema: "IA no Setor Público e Combate à Corrupção / Gestão", prop: [ { c: "Lula", t: "Transformação do Portal da Transparência em plataforma inteligente com IA." }, { c: "Ronaldo Caiado", t: "Plataforma de análise de riscos em gastos públicos com IA e dados abertos." }, { c: "Romeu Zema", t: "Adoção de tecnologias do mercado para direcionamento inteligente de processos e filas." }, { c: "Flávio Bolsonaro", t: "Assistentes automatizados no governo e IA para segurança/prevenção." }, { c: "Renan Santos", t: "Uso de IA e dados integrados para diagnóstico público e laboratórios." }, { c: "Augusto Cury", t: "IA no controle de gastos e combate a fraudes (Programa SEO) e na Segurança Pública 4.0 (Projeto FATO)." } ] },
        { tema: "Parcerias Universidade-Empresa e Formação de Talentos", prop: [ { c: "Lula", t: "Programa Conhecimento Brasil e formação de pesquisadores em áreas estratégicas." }, { c: "Ronaldo Caiado", t: "Centros de excelência em IA e formação/retenção de talentos." }, { c: "Romeu Zema", t: "Integração universidade-empresa (4 propostas) e atração de investimento privado em P&D." }, { c: "Flávio Bolsonaro", t: "Política Nacional de Formação de Talentos e expansão de parques tecnológicos/incubadoras." }, { c: "Renan Santos", t: "Projeto Abaporu (laboratório nacional) e formação/repatriamento de talentos em IA." }, { c: "Augusto Cury", t: "Concessão de bolsas de mestrado/doutorado em IA aplicada e incentivo a startups universitárias." } ] },
        { tema: "Proteção de Crianças e Adolescentes no Ambiente Digital", prop: [ { c: "Lula", t: "Aprimoramento do ECA Digital, regulação de telas por faixa etária e regulação de jogos digitais." }, { c: "Ronaldo Caiado", t: "Regras de responsabilidade para plataformas e implementação da proteção a crianças/jovens." }, { c: "Augusto Cury", t: "Projeto de Lei Augusto Cury contra predadores sexuais e regulação de conteúdos nocivos/algoritmos para jovens." } ] },
        { tema: "Capacidade Nacional e Política de Semicondutores", prop: [ { c: "Ronaldo Caiado", t: "Construção de capacidade nacional em semicondutores e computação quântica." }, { c: "Augusto Cury", t: "Política Nacional de Semicondutores/microeletrônica e transformação da Zona Franca de SP em polo de hardware e IA." } ] }
    ];

    let candidatoAtual = null;

    function formatName(name) {
        if (name === "Augusto Cury") {
            return 'Augusto Cury<span class="asterisk" onclick="abrirModal(event)" title="Aviso sobre este candidato">*</span>';
        }
        return name;
    }

    function iniciar() {
        const lista = document.getElementById('lista-cards-cand');
        const select = document.getElementById('select-comparar');
        candidatosData.forEach(cand => {
            lista.innerHTML += '<div class="candidate-card" onclick="abrirDetalhe(\'' + cand.id + '\')"><div class="candidate-profile"><img src="' + cand.foto + '" class="candidate-photo"> <span class="candidate-name">' + formatName(cand.nome) + '</span></div><span class="candidate-total">' + cand.total + ' propostas</span></div>';
            select.innerHTML += '<option value="' + cand.id + '">' + cand.nome + (cand.id === 'cury' ? '*' : '') + '</option>';
        });
        renderizarListaConvergencias();
    }

    function renderizarListaConvergencias() {
        const container = document.getElementById('grafico-convergencias');
        container.innerHTML = '';
        convergenciasData.forEach((conv, i) => {
            let html = '<div class="bar-container" onclick="toggleEixo(\'conv-' + i + '\')">';
            html += '<div class="bar-label">' + conv.tema + '</div>';
            html += '<div class="bar-track"><div class="bar-fill" style="width:100%; background:#B0BEC5; color:#37474F; padding-left:16px;">' + conv.prop.length + ' candidatos concordam</div></div></div>';
            
            let propsHtml = '<div class="propostas-lista" id="conv-' + i + '" style="border-left: 6px solid #90A4AE;"><ul style="padding-left:10px;">';
            conv.prop.forEach(p => {
                propsHtml += '<li style="margin-bottom:16px;"><strong>' + formatName(p.c) + ':</strong><br>' + p.t + '</li>';
            });
            propsHtml += '</ul></div>';
            
            container.innerHTML += html + propsHtml;
        });
    }

    function abrirConvergencia() {
        document.getElementById('lista-candidatos').style.display = 'none';
        document.getElementById('detalhe-convergencia').style.display = 'block';
    }

    function abrirDetalhe(id) {
        candidatoAtual = candidatosData.find(c => c.id === id);
        document.getElementById('lista-candidatos').style.display = 'none';
        document.getElementById('detalhe-candidato').style.display = 'block';
        document.getElementById('header-candidato-detalhe').innerHTML = '<img src="' + candidatoAtual.foto + '" class="candidate-photo"><span class="candidate-name">' + formatName(candidatoAtual.nome) + '</span>';
        document.getElementById('select-comparar').value = "";
        renderizarGraficos();
    }

    function buildPropostasHTML(eixo) {
        let html = '';
        eixo.propostas.forEach(p => {
            if(p.original && p.original.trim() !== "") {
                html += '<li class="prop-item-container">';
                html += '  <div class="prop-resumo" onclick="toggleOriginal(this, event)">';
                html += '    <span class="seta-expansao">►</span> ' + p.curto;
                html += '  </div>';
                html += '  <div class="texto-original">"' + p.original + '"</div>';
                html += '</li>';
            } else {
                html += '<li class="prop-item-container" style="padding-left: 20px;"><div class="prop-resumo" style="cursor:default;">' + p.curto + '</div></li>';
            }
        });
        return html;
    }

    function renderizarGraficos() {
        const idRival = document.getElementById('select-comparar').value;
        const rival = idRival ? candidatosData.find(c => c.id === idRival) : null;
        const container = document.getElementById('grafico-barras');
        container.innerHTML = '';

        candidatoAtual.eixos.forEach((eixo, i) => {
            const eixoRival = rival ? rival.eixos[i] : null;
            const pct = (eixo.valor / 15) * 100;
            const cor = "hsl(210, 80%, " + (75 - (eixo.valor / 15) * 45) + "%)";
            
            let html = '<div class="bar-container" onclick="toggleEixo(\'prop-' + i + '\')">';
            html += '<div class="bar-label">' + eixo.nome + '</div>';
            html += '<div class="compare-row">';
            html += '<div class="track-col"><span class="track-name">' + formatName(candidatoAtual.nome) + ' (' + eixo.valor + ')</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + cor + ';"></div></div></div>';
            
            if(rival) {
                const pctRival = (eixoRival.valor / 15) * 100;
                html += '<div class="track-col"><span class="track-name">' + formatName(rival.nome) + ' (' + eixoRival.valor + ')</span><div class="bar-track"><div class="bar-fill" style="width:' + pctRival + '%; background:hsl(0, 0%, ' + (80 - (eixoRival.valor / 15) * 40) + '%);"></div></div></div>';
            }
            html += '</div></div>';

            let propsHtml = '<div class="propostas-lista" id="prop-' + i + '" style="border-left: 6px solid ' + cor + '">';
            propsHtml += '<h4>' + formatName(candidatoAtual.nome) + '</h4><ul>';
            propsHtml += buildPropostasHTML(eixo);
            propsHtml += '</ul>';
            
            if(rival) {
                propsHtml += '<h4 style="margin-top: 24px;">' + formatName(rival.nome) + '</h4><ul>';
                propsHtml += buildPropostasHTML(eixoRival);
                propsHtml += '</ul>';
            }
            propsHtml += '</div>';
            container.innerHTML += html + propsHtml;
        });
    }

    function toggleEixo(id) {
        const el = document.getElementById(id);
        if (el.style.display === 'block') {
            el.style.display = 'none';
        } else {
            el.style.display = 'block';
            setTimeout(() => {
                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 150);
        }
    }

    function toggleOriginal(elemento, event) {
        event.stopPropagation(); 
        
        const container = elemento.parentElement;
        const textoOriginal = container.querySelector('.texto-original');
        const seta = container.querySelector('.seta-expansao');
        const estaAberto = textoOriginal.style.display === 'block';
        
        fecharTodasAsPropostas();
        
        if (!estaAberto) {
            textoOriginal.style.display = 'block';
            seta.classList.add('aberta');
        }
    }

    function fecharTodasAsPropostas() {
        document.querySelectorAll('.texto-original').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.seta-expansao').forEach(el => el.classList.remove('aberta'));
    }

    document.addEventListener('click', function(event) {
        if (!event.target.closest('.prop-item-container')) {
            fecharTodasAsPropostas();
        }
    });

    function voltarParaLista() {
        document.getElementById('detalhe-convergencia').style.display = 'none';
        document.getElementById('detalhe-candidato').style.display = 'none';
        document.getElementById('lista-candidatos').style.display = 'block';
    }

    function abrirModal(e) {
        e.stopPropagation();
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function fecharModal(e) {
        if(e) e.stopPropagation();
        document.getElementById('modal-overlay').style.display = 'none';
    }

    iniciar();
</script>
</body>
</html>
